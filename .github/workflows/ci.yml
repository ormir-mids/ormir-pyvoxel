name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: setup.py
      - name: Install lint tools
        run: python -m pip install 'isort==9.0.2' 'black==26.10.1' 'flake8==7.5.0' 'flake8-bugbear==26.11.9' 'flake8-comprehensions==3.17.0'
      - name: Lint
        run: make lint

  test:
    runs-on: ubuntu-latest
  
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: setup.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' torch
      - name: Run tests
        env:
          VOXEL_UNITTEST_DISABLE_DATA: "false"
        run: make test-cov
