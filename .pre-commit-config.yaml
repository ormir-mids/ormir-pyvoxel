repos:
-   repo: https://github.com/PyCQA/isort
    rev: 9.0.2
    hooks:
    -   id: isort
-   repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
    - id: black
      language_version: python3
-   repo: https://github.com/PyCQA/flake8
    rev: 7.5.0
    hooks:
    -   id: flake8
        additional_dependencies: [flake8-bugbear==26.11.9, flake8-comprehensions==3.17.0]
